# Holt die Secrets aus dem STACKIT Secrets Manager (geschrieben von Terraform, Stack 20-platform).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: askit-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: stackit-secrets-manager
  target:
    name: askit-app
  dataFrom:
    - extract:
        key: askit/app-db
    - extract:
        key: askit/object-storage
    - extract:
        key: askit/ai
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: stackit-secrets-manager
  target:
    name: keycloak
  dataFrom:
    - extract:
        key: askit/keycloak-db
    - extract:
        key: askit/keycloak-admin
---
# imagePullSecret für registry.onstackit.cloud, gebaut aus dem Robot Account
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: stackit-secrets-manager
  target:
    name: registry
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"registry.onstackit.cloud":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  dataFrom:
    - extract:
        key: askit/registry
