# Eine Domain für alles: Frontend, API und Keycloak (/auth).
# Hostname wird im Overlay per Kustomize-Replacement gesetzt.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: askit
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts: [HOST_PLACEHOLDER]
      secretName: askit-tls
  rules:
    - host: HOST_PLACEHOLDER
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: backend, port: { name: http } } }
          - path: /auth
            pathType: Prefix
            backend: { service: { name: keycloak, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { name: http } } }
