apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: { app.kubernetes.io/name: backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: backend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: backend }
      annotations:
        # Für Prometheus-kompatible Scraper (z. B. mit einer Scrape-Config in STACKIT Observability)
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      imagePullSecrets:
        - name: registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: backend }
      containers:
        - name: backend
          image: askit-backend
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: askit-infra }   # von Terraform (DB-Host, Bucket, Modell)
            - secretRef: { name: askit-app }        # von ESO aus dem Secrets Manager
          env:
            - name: APP_HOST
              valueFrom:
                configMapKeyRef: { name: askit-params, key: APP_HOST }
            - name: OIDC_ISSUER
              value: https://$(APP_HOST)/auth/realms/askit
            - name: OIDC_JWKS_URL
              value: http://keycloak:8080/auth/realms/askit/protocol/openid-connect/certs
            - name: DB_SSL
              value: require
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: { app.kubernetes.io/name: backend }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: backend }
