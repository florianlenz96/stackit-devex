# STACKIT Secrets Manager ist Vault-kompatibel: KV v2, Mount = Instanz-ID, Login per userpass.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: stackit-secrets-manager
spec:
  provider:
    vault:
      server: {{ .Values.secretsManager.address | quote }}
      path: {{ .Values.secretsManager.instanceId | quote }}
      version: v2
      auth:
        userPass:
          path: userpass
          username: {{ .Values.secretsManager.username | quote }}
          secretRef:
            name: {{ .Values.secretsManager.passwordSecret.name }}
            namespace: {{ .Values.secretsManager.passwordSecret.namespace }}
            key: password
